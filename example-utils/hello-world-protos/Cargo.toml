[package]
name = "hello-world-protos"
description = "Useful protos to be used when doing tests"
documentation.workspace = true
edition.workspace = true
exclude.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bytes = { version = "1.12.1" }
protobuf = { workspace = true, features = ["with-bytes"] }

[build-dependencies]
protobuf-codegen = { version = "3.7.2" }
protoc-bin-vendored = { version = "3.2" }
reqwest = { version = "0.12", features = ["blocking"] }
